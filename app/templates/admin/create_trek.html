{% extends "base.html" %}

{% block title %}Create Trek - Admin{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-mountain me-1"></i>Create New Trek</h4>
                </div>
                
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('admin.create_trek') }}" novalidate>
                        
                        <!-- Trek Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label">Trek Name <span class="text-danger">*</span></label>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="name" 
                                name="name" 
                                placeholder="e.g., Everest Base Camp Trek"
                                required
                            >
                        </div>
                        
                        <!-- Location -->
                        <div class="mb-3">
                            <label for="location" class="form-label">Location <span class="text-danger">*</span></label>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="location" 
                                name="location" 
                                placeholder="e.g., Nepal, Himalayas"
                                required
                            >
                        </div>
                        
                        <!-- Difficulty & Duration (2 columns) -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="difficulty" class="form-label">Difficulty Level <span class="text-danger">*</span></label>
                                <select class="form-select" id="difficulty" name="difficulty" required>
                                    <option value="">-- Select --</option>
                                    <option value="Easy">Easy</option>
                                    <option value="Moderate">Moderate</option>
                                    <option value="Hard">Hard</option>
                                    <option value="Extreme">Extreme</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="duration" class="form-label">Duration (days) <span class="text-danger">*</span></label>
                                <input 
                                    type="number" 
                                    step="0.5"
                                    class="form-control" 
                                    id="duration" 
                                    name="duration" 
                                    placeholder="e.g., 7"
                                    required
                                >
                            </div>
                        </div>
                        
                        <!-- Dates (2 columns) -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="start_date" class="form-label">Start Date <span class="text-danger">*</span></label>
                                <input 
                                    type="date" 
                                    class="form-control" 
                                    id="start_date" 
                                    name="start_date"
                                    required
                                >
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="end_date" class="form-label">End Date <span class="text-danger">*</span></label>
                                <input 
                                    type="date" 
                                    class="form-control" 
                                    id="end_date" 
                                    name="end_date"
                                    required
                                >
                            </div>
                        </div>
                        
                        <!-- Total Slots -->
                        <div class="mb-4">
                            <label for="total_slots" class="form-label">Total Slots Available <span class="text-danger">*</span></label>
                            <input 
                                type="number" 
                                class="form-control" 
                                id="total_slots" 
                                name="total_slots" 
                                placeholder="e.g., 20"
                                min="1"
                                required
                            >
                            <small class="form-text text-muted">Number of participants this trek can accommodate</small>
                        </div>
                        
                        <!-- Form Actions -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary"><i class="bi bi-x-circle me-1"></i>Cancel</a>
                            <button type="submit" class="btn btn-primary">Create Trek</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
